<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kedileri Besle 🐱</title>
<style>
:root{--wall:#fbe0c3;--floor:#d9a066;--ink:#5a3e36;--card:#ffffff;--accent:#ff7a9a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wall:#3b2b45;--floor:#4d3a3a;--ink:#ffe9d6;--card:#3a2c3d;--accent:#ff8fab}}
:root[data-theme="dark"]{--wall:#3b2b45;--floor:#4d3a3a;--ink:#ffe9d6;--card:#3a2c3d;--accent:#ff8fab}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{position:relative;background:linear-gradient(var(--wall) 0 422px,#8a5a3a 422px 432px,var(--floor) 432px);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;text-align:center;overflow-x:hidden}
.win{position:absolute;top:142px;left:50%;transform:translateX(-50%);width:min(200px,50vw);z-index:0}
.win svg{width:100%;display:block}
.deco{position:absolute;top:180px;font-size:clamp(1.6rem,6vw,2.6rem);z-index:0}
.deco.l{left:5%}.deco.r{right:5%}
h1,.hint,.stage{position:relative;z-index:1}
h1{font-size:clamp(1.1rem,4.5vw,1.8rem);margin:14px auto 6px;max-width:92%;width:fit-content;padding:8px 16px;min-height:2.4em;display:flex;align-items:center;justify-content:center}
h1,.hint{background:color-mix(in srgb,var(--card) 82%,transparent);border-radius:16px}
.stage{display:flex;align-items:center;justify-content:center;gap:10px;max-width:760px;margin:215px auto 0;padding:8px 10px}
.cats{flex:1;display:flex;gap:6px;justify-content:space-around}
.cat{flex:1;max-width:210px;display:flex;flex-direction:column;align-items:center}
.cat svg{width:100%;height:auto;display:block;overflow:visible}
.bowl{cursor:pointer}
.food{width:76px;flex:none;cursor:pointer;background:var(--card);border-radius:20px;padding:8px 4px;border:3px solid transparent;transition:.2s;font-size:.7rem;font-weight:bold}
.food.sel{border-color:var(--accent);transform:scale(1.1);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 30%,transparent)}
.food svg{width:100%;height:auto}
.happy-eyes,.kibble,.hearts{display:none}
.fed .happy-eyes,.fed .kibble,.fed .hearts{display:inline}
.fed .sad-eyes,.fed .mouth-sad{display:none}
.hearts{animation:up 1.6s ease-out infinite}
@keyframes up{0%{transform:translateY(10px);opacity:0}30%{opacity:1}100%{transform:translateY(-20px);opacity:0}}
.hungry .head{animation:wob 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wob{50%{transform:rotate(3deg)}}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cakepop{position:fixed;left:50%;top:118px;width:min(220px,56vw);transform:translateX(-50%) scale(.6);opacity:0;transition:.5s;pointer-events:none;z-index:3;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.cakepop.show{opacity:1;transform:translateX(-50%) scale(1)}
.cakepop.big{top:46%;transform:translate(-50%,-50%) scale(1.4);transition:1.6s cubic-bezier(.2,.9,.3,1.15)}
.cakepop svg{width:100%;display:block}
.slice{opacity:.15;transition:opacity .8s}
.slice.on{opacity:1}
#cf{position:fixed;inset:0;pointer-events:none;z-index:5}
.hint{width:fit-content;max-width:92%;margin:0 auto;padding:4px 12px;font-size:.85rem;min-height:1.3em}
.hint.love{font-weight:bold;font-size:1.05rem}
.hat{display:none}
.party .hat{display:inline;animation:hatin .5s}
@keyframes hatin{from{opacity:0}to{opacity:1}}
.cat.party{animation:jump .7s ease-in-out infinite}
.cat.party:nth-child(2){animation-delay:.15s}
.cat.party:nth-child(3){animation-delay:.3s}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px)}}
.balloon{position:fixed;bottom:-130px;width:var(--s);height:calc(var(--s)*1.25);border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0 12%,transparent 13%),var(--c);box-shadow:inset -6px -8px 0 rgba(0,0,0,.12);z-index:4;pointer-events:auto;cursor:pointer;touch-action:manipulation;animation:rise var(--d) linear var(--dl) forwards}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:60px;background:rgba(0,0,0,.3)}
.balloon::before{content:"";position:absolute;left:calc(50% - 5px);top:calc(100% - 3px);border:5px solid transparent;border-bottom:8px solid var(--c);border-top:0}
@keyframes rise{0%{transform:translate(0,0)}50%{transform:translate(var(--x),-60vh)}100%{transform:translate(0,-140vh)}}
</style>
</head>

    '<g class="bowl" data-i="'+i+'"><ellipse cx="80" cy="176" rx="46" ry="10" fill="#000" opacity=".12"/>'+
    '<path d="M32 150 h96 q-4 30 -48 30 q-44 0 -48 -30Z" fill="#6bb6e8"/><ellipse cx="80" cy="150" rx="48" ry="9" fill="#9ad0f2"/><ellipse cx="80" cy="151" rx="38" ry="6" fill="#4f95c4"/>'+
    '<g class="kibble" fill="#8a5a33"><circle cx="62" cy="146" r="7"/><circle cx="80" cy="141" r="8"/><circle cx="98" cy="146" r="7"/><circle cx="71" cy="138" r="6"/><circle cx="90" cy="137" r="6"/></g>'+
    '<path d="M32 150 h96 q-1 8 -6 14 h-84 q-5 -6 -6 -14Z" fill="#6bb6e8" opacity="0"/></g></svg>';
  }
  cols.forEach(function(c,i){
    var d=document.createElement('div'); d.className='cat hungry'; d.id='cat'+i; d.innerHTML=catSvg(c,i); catsEl.appendChild(d);
  });

  var cakePop=document.getElementById('cakepop'), cakeTimer;
  function showCake(stay){clearTimeout(cakeTimer);cakePop.classList.add('show');if(!stay)cakeTimer=setTimeout(function(){cakePop.classList.remove('show')},2600);}

  food.addEventListener('click',function(){
    if(done)return; holding=!holding; food.classList.toggle('sel',holding); if(holding)rustle();
    hint.textContent=holding?'Mama seçildi! Şimdi boş bir kaba dokun 🥣':'Önce sağdaki mamaya dokun, sonra boş bir mama kabına.';
  });

  catsEl.addEventListener('click',function(e){
    var b=e.target.closest('.bowl'); if(!b||done)return; var i=+b.dataset.i, cat=document.getElementById('cat'+i);
    if(!holding){ cat.classList.remove('shake'); void cat.offsetWidth; cat.classList.add('shake'); hint.textContent='Önce sağdaki mamayı seçmelisin 😺'; meow(Math.floor(Math.random()*3)); return; }
    if(fed[i])return;
    fed[i]=true; holding=false; food.classList.remove('sel');
    cat.classList.add('fed'); cat.classList.remove('hungry'); crunch(); setTimeout(function(){meow(i)},350);
    document.getElementById('s'+i).classList.add('on'); showCake(false);
    var n=fed.filter(Boolean).length;
    if(n<3){ msg.textContent=n===1?'Bir tane doydu, kalan '+(3-n)+' kedi hâlâ aç! 😼':'Son bir kedi kaldı, hadi! 🙀'; hint.textContent='Yine mamaya dokunup sıradaki kaba tıkla.'; }
    else win();
  });

  var POP_VOL=.22;
  function popSound(){var c=ac();if(!c)return;var n=Math.floor(c.sampleRate*.12),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);var s=c.createBufferSource();s.buffer=b;var f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=900+Math.random()*800;f.Q.value=.7;var g=c.createGain();g.gain.value=POP_VOL*3;s.connect(f);f.connect(g);g.connect(c.destination);s.start();}
  function burst(x,y,col){for(var i=0;i<14;i++){var a=Math.random()*6.28,v=3+Math.random()*5;parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,w:5,h:5,c:col,r:0,vr:.3,life:250});}if(!running){running=true;tick();}}
  function popBalloon(e){var b=e.currentTarget;if(b._p)return;b._p=1;var r=b.getBoundingClientRect(),c=getComputedStyle(b).getPropertyValue('--c').trim()||'#ff7a9a';popSound();burst(r.left+r.width/2,r.top+r.height/2,c);b.remove();}
  function balloons(){var cs=['#ff7a9a','#ffd166','#6bb6e8','#8ad6c5','#c79bff','#ff9f43'];function wave(n){for(var i=0;i<n;i++){var b=document.createElement('div');b.className='balloon';var s=38+Math.random()*28;b.style.cssText='left:'+(Math.random()*92)+'vw;--s:'+s+'px;--c:'+cs[i%cs.length]+';--d:'+(6+Math.random()*5)+'s;--dl:'+(Math.random()*2.5)+'s;--x:'+((Math.random()-.5)*60)+'px';b.addEventListener('animationend',function(){this.remove();});b.addEventListener('pointerdown',popBalloon);document.body.appendChild(b);}}wave(16);setTimeout(function(){wave(12);},5500);}
  function win(){ setTimeout(function(){document.querySelectorAll('.cat').forEach(function(c){c.classList.add('party');});},400); balloons();
    done=true; msg.textContent='🎉 Doğum günün kutlu olsun'+(name?' '+name:'')+'! 🎂'; hint.textContent='🐱🐱🐱 Kediler de seni çok seviyor! 💗'; hint.classList.add('love'); showCake(true); setTimeout(function(){cakePop.classList.add('big')},1000); setTimeout(winSound,900);
    confetti();
  }

  var cv=document.getElementById('cf'), ctx=cv.getContext('2d'), parts=[];
  function size(){cv.width=innerWidth;cv.height=innerHeight}
  size(); addEventListener('resize',size);
  function confetti(){
    var cs=['#ff7a9a','#ffd166','#8ad6c5','#6bb6e8','#c79bff','#ff9f43'];
    for(var i=0;i<220;i++){
      parts.push({x:cv.width/2,y:cv.height*0.45,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,w:6+Math.random()*6,h:4+Math.random()*6,c:cs[i%cs.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:0});
    }
    for(var j=0;j<2;j++)setTimeout(function(){for(var i=0;i<120;i++)parts.push({x:Math.random()*cv.width,y:-10,vx:(Math.random()-.5)*3,vy:Math.random()*3+1,w:6+Math.random()*6,h:4+Math.random()*6,c:cs[i%cs.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:0})},900*(j+1));
    if(!running){running=true;tick()}
  }
  var running=false;
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    parts=parts.filter(function(p){return p.y<cv.height+20&&p.life<400});
    parts.forEach(function(p){p.life++;p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});
    if(parts.length)requestAnimationFrame(tick);else running=false;
  }
})();
</script>
</body>
</html>
